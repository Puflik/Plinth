# Сборке нужен JDK 21. Android Studio берёт свой JBR сам; в терминале
# укажите JAVA_HOME на JDK 21 (например, на JBR из Android Studio).
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
