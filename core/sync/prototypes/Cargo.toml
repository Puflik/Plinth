# C1 — выбрасываемые прототипы CRDT-журнала (tasks-v0.2.md, эпик C).
# Отдельный workspace: в ядро, его Cargo.lock и CI не входит. Итог — BENCH.md
# и docs/adr/0006-crdt-library.md; после C2 каталог удаляется.
[workspace]
resolver = "3"
members = ["common", "baseline", "automerge", "yrs"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
proto-common = { path = "common" }
automerge = "0.12.0"
yrs = "0.28.0"

# Тот же профиль, что у ядра (core/Cargo.toml): замеры скорости и веса .so —
# в тех условиях, в которых библиотека поедет в APK.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
