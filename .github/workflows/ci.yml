name: CI

on:
  push:
    # work/** — ветки исполнителей (docs/work/README.md): ревью Opus видит CI.
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rust-ядро (A2.3): быстрее Android-сборки и падает раньше неё.
  core:
    name: Rust core — format, clippy, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@v4

      # Версия, компоненты и таргеты — из core/rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: rustfmt
        run: cargo fmt --all -- --check

      # unwrap/expect/panic! в коде ядра — ошибка (core/Cargo.toml, [workspace.lints]).
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Лог — ещё и в файл: следующий шаг достаёт из него упавшие тесты.
      - name: Tests
        shell: bash
        run: cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"

      # Упавшие тесты и паники — в аннотацию: аннотации API GitHub отдаёт без
      # входа, а лог шага — только после входа.
      - name: Failed tests to annotation
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/cargo-test.log"
          [ -f "$log" ] || exit 0
          out="$RUNNER_TEMP/cargo-test-failed.txt"
          grep -E -A12 '^---- .+ stdout ----$' "$log" | head -n 150 > "$out" || true
          grep -E "^test .+ FAILED$|^error: test failed|didn't exit successfully|signal: " "$log" | head -n 30 >> "$out" || true
          python3 - "$out" <<'EOF'
          import sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read().strip()
          text = text or "no failure lines in the log"
          print("::error title=cargo test failed::" + text.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          EOF

  check:
    name: Style, tests, both flavors
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Сборка APK зовёт cargo (плагин plinth.rust): .so под четыре ABI и
      # Kotlin-биндинги. Нужны Rust, NDK и cargo-ndk — docs/BUILD.md.
      - name: Install Rust
        working-directory: core
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install NDK
        # Версия — ndk из gradle/libs.versions.toml.
        run: |
          ndk=$(awk -F'"' '/^ndk = /{print $2}' gradle/libs.versions.toml)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        # core.filemode=false на Windows: бит запуска в коммит не попадает.
        run: chmod +x gradlew

      # Стиль проверяется первым: он дешевле сборки и падает за секунды.
      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      # Android lint: ошибки (NewApi и прочие) роняют сборку — так бы поймалась
      # находка Н1 приёмки v0.2, вызов API 33 при minSdk 26. Предупреждения
      # не роняют, они в отчёте (Upload reports). У flavor свои исходники —
      # проверяются оба.
      - name: Android lint, both flavors
        run: ./gradlew lintGithubDebug lintFdroidDebug

      - name: Unit tests, both flavors
        run: ./gradlew testGithubDebugUnitTest testFdroidDebugUnitTest

      - name: Assemble both flavors
        run: ./gradlew assembleGithubDebug assembleFdroidDebug

      # Бюджет размера (docs/BUILD.md, docs/testing/apk-size.md): релизный APK
      # со всеми ABI — не больше 30 МБ, у каждой flavor. Без ключа release
      # собирается неподписанным — размер от подписи почти не меняется.
      # fdroid здесь потому, что F-Droid собирает из исходников своим конвейером:
      # красный release этой flavor дешевле увидеть в нашем CI, чем на их сборке.
      # Нет APK — шаг падает, пустой glob не проходит молча.
      - name: Release APKs within the size budget
        run: |
          ./gradlew assembleGithubRelease assembleFdroidRelease
          budget=30000000
          for dir in app/build/outputs/apk/github/release app/build/outputs/apk/fdroid/release; do
            found=0
            for apk in "$dir"/*.apk; do
              test -f "$apk" || continue
              found=1
              size=$(stat -c %s "$apk")
              echo "$apk: $size bytes, budget $budget"
              test "$size" -le "$budget" || { echo "::error::$apk is over the size budget"; exit 1; }
            done
            test "$found" = 1 || { echo "::error::no release APK in $dir"; exit 1; }
          done

      # Страж вывода R8 (R8OutputGuardTest): Rhino и языки экстрактора остаются под
      # своими именами в mapping.txt и seeds.txt шага выше. Файл правил и вывод R8
      # не входы задачи test, а в gradle.properties включён кэш сборки: без --rerun
      # Gradle мог бы взять старый зелёный результат, и страж «прошёл» бы, не
      # выполнившись. Проверка XML — что все три теста выполнены, а не пропущены
      # (без вывода R8 тест пропускается; PLINTH_REQUIRE_R8_OUTPUT делает это провалом).
      - name: R8 keeps what the rules promise
        env:
          PLINTH_REQUIRE_R8_OUTPUT: "1"
        run: |
          ./gradlew testGithubDebugUnitTest --tests '*R8OutputGuardTest' --rerun
          xml=app/build/test-results/testGithubDebugUnitTest/TEST-io.github.puflik.plinth.R8OutputGuardTest.xml
          grep -q 'tests="3"' "$xml" && grep -q 'skipped="0"' "$xml" || { echo "::error::R8OutputGuardTest did not run all 3 tests"; exit 1; }

      # Эмулятора в CI нет, но APK инструментальных тестов собрать можно:
      # так ловятся ошибки, которые видит только DEX, — например, пробелы
      # в именах тестов, недопустимые до API 30.
      - name: Assemble instrumented tests
        run: ./gradlew assembleGithubDebugAndroidTest

      # seeds.txt и configuration.txt R8 — по ним читается красный страж R8.
      # mapping.txt (около 57 МБ) не грузим.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/mapping/*/seeds.txt
            app/build/outputs/mapping/*/configuration.txt
          retention-days: 7
          if-no-files-found: ignore
