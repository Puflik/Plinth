name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rust-ядро (A2.3): быстрее Android-сборки и падает раньше неё.
  core:
    name: Rust core — format, clippy, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@v4

      # Версия, компоненты и таргеты — из core/rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: rustfmt
        run: cargo fmt --all -- --check

      # unwrap/expect/panic! в коде ядра — ошибка (core/Cargo.toml, [workspace.lints]).
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  check:
    name: Style, tests, both flavors
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Сборка APK зовёт cargo (плагин plinth.rust): .so под четыре ABI и
      # Kotlin-биндинги. Нужны Rust, NDK и cargo-ndk — docs/BUILD.md.
      - name: Install Rust
        working-directory: core
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install NDK
        # Версия — ndk из gradle/libs.versions.toml.
        run: |
          ndk=$(awk -F'"' '/^ndk = /{print $2}' gradle/libs.versions.toml)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        # core.filemode=false на Windows: бит запуска в коммит не попадает.
        run: chmod +x gradlew

      # Стиль проверяется первым: он дешевле сборки и падает за секунды.
      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      # Android lint: ошибки (NewApi и прочие) роняют сборку — так бы поймалась
      # находка Н1 приёмки v0.2, вызов API 33 при minSdk 26. Предупреждения
      # не роняют, они в отчёте (Upload reports). У flavor свои исходники —
      # проверяются оба.
      - name: Android lint, both flavors
        run: ./gradlew lintGithubDebug lintFdroidDebug

      - name: Unit tests, both flavors
        run: ./gradlew testGithubDebugUnitTest testFdroidDebugUnitTest

      - name: Assemble both flavors
        run: ./gradlew assembleGithubDebug assembleFdroidDebug

      # Бюджет размера (docs/BUILD.md, docs/testing/apk-size.md): релизный APK
      # со всеми ABI — не больше 30 МБ. Без ключа release собирается
      # неподписанным — размер от подписи почти не меняется.
      - name: Release APK within the size budget
        run: |
          ./gradlew assembleGithubRelease
          budget=30000000
          for apk in app/build/outputs/apk/github/release/*.apk; do
            size=$(stat -c %s "$apk")
            echo "$apk: $size bytes, budget $budget"
            test "$size" -le "$budget" || { echo "::error::$apk is over the size budget"; exit 1; }
          done

      # Эмулятора в CI нет, но APK инструментальных тестов собрать можно:
      # так ловятся ошибки, которые видит только DEX, — например, пробелы
      # в именах тестов, недопустимые до API 30.
      - name: Assemble instrumented tests
        run: ./gradlew assembleGithubDebugAndroidTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
