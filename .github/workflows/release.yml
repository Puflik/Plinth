# Тег вида v0.1.0 → подписанный APK flavor `github` → GitHub Release.
# Написан сейчас (A1.5), включается в работу в H5: до тех пор в репозитории
# нет ни тегов, ни секретов с ключом подписи.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Signed APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        # core.filemode=false на Windows: бит запуска в коммит не попадает.
        run: chmod +x gradlew

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 не задан — подписать релиз нечем."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/plinth.jks"

      - name: Build signed APK
        env:
          PLINTH_KEYSTORE_FILE: ${{ runner.temp }}/plinth.jks
          PLINTH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PLINTH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PLINTH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleGithubRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            app/build/outputs/apk/github/release/*.apk

      - name: Drop keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/plinth.jks"
