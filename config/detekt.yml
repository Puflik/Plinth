# Надстройка над правилами detekt по умолчанию (buildUponDefaultConfig = true).
# Здесь живут только отклонения от стандарта и их причины.
#
# Зоны ответственности разведены: форматирование целиком за ktlint
# (.editorconfig), detekt смотрит только на запахи кода и сложность.
# Набор detekt-formatting намеренно не подключён — он несёт свою,
# более старую копию правил ktlint, и два линтера начинают спорить
# об одних и тех же отступах.

complexity:
  LongParameterList:
    # У @Composable параметров естественно много: состояние + колбэки + модификатор.
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # detekt 2.0: «разрешено столько», а не «порог срабатывания» 1.x —
    # 19 разрешённых здесь то же, что прежний порог 20.
    allowedFunctionsPerFile: 19
    allowedFunctionsPerClass: 19
    ignoreAnnotatedFunctions: ['Composable', 'Test']

naming:
  FunctionNaming:
    # @Composable-функции по соглашению Compose пишутся с заглавной буквы.
    # Имена тестов — фразы: в обратных кавычках (JVM) или через подчёркивание
    # (всё, что попадает в DEX); то же исключение задано ktlint в .editorconfig.
    ignoreAnnotated: ['Composable', 'Test']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 120
  UnusedPrivateFunction:
    # Приватные @Preview нигде не вызываются — их вызывает Studio.
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    # TODO по ходу волны — рабочий инструмент, а не нарушение.
    active: false
